# LimooCast — sender APK build (debug) + relay test
#
# Build gate for the Android sender app. No Go, no NDK: plain Kotlin +
# Android SDK. A green run uploads the debug APK as an artifact.
name: Build LimooCast

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE (2026-11-23): android-actions/setup-android@v3 is broken with
      # current cmdline-tools (16.0) — it runs `sdkmanager tools` and the
      # `tools` package no longer exists, so the step fails with exit 1.
      # The ubuntu runner already ships a full Android SDK, so install the
      # exact packages this build needs directly with sdkmanager instead.
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          # sdkmanager is NOT on PATH on the runner; it lives under
          # $ANDROID_HOME/cmdline-tools/<version>/bin/
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: limoocast-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  relay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Relay test (bit-for-bit PCM forwarding)
        working-directory: server
        run: npm test
