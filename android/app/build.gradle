android {
    namespace = "com.limoo.limoocast"
    compileSdk = 35

    // Stable debug signing key, committed to the repo (debug keystore with
    // the standard public debug credentials android/android — same as the
    // SDK's default debug key, safe to commit by design). Without this,
    // every GitHub runner generates its own debug key and the APK will NOT
    // install over the previous build ("signatures do not match").
    // v1.0.0/v1.1.0 were signed with runner-generated keys, so v1.1.1
    // needs ONE manual uninstall — after that, every build installs over.
    signingConfigs {
        debug {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    defaultConfig {
        applicationId = "com.limoo.limoocast"
        minSdk = 29 // AudioPlaybackCapture needs API 29+
        targetSdk = 35
        versionCode = 3
        versionName = "1.1.1"
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
}
